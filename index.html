function setPlan(inp){
  const ano=fP.ano, c=inp.dataset.c, i=+inp.dataset.i;
  const P=D().planejado[ano]=D().planejado[ano]||{}; const a=P[c]=P[c]||Array(12).fill(0);
  a[i]=parseMoney(inp.value); inp.value=mv(a[i]); touch(); updPlanTotais();
}
function planNav(e,inp){ if(e.key!=="Enter") return; e.preventDefault(); const all=[...document.querySelectorAll("#panel-dplan .pinp")]; const k=all.indexOf(inp); inp.dispatchEvent(new Event("change")); (all[k+1]||inp).focus(); }
function updPlanTotais(){
  const ano=fP.ano, P=D().planejado[ano]||{}, root=$("panel-dplan");
  root.querySelectorAll("tr[data-c]").forEach(tr=>{ tr.querySelector(".ptot").textContent=nf2(sum(P[tr.dataset.c]||[],x=>x)); });
  root.querySelectorAll("tr.grp").forEach(tr=>{ const cs=[...root.querySelectorAll(`tr[data-gr="${tr.dataset.g}"]`)].map(x=>x.dataset.c);
    tr.querySelectorAll(".gsub").forEach(td=>{ const i=td.dataset.i; td.textContent=nf2(sum(cs,c=>i==="t"?sum(P[c]||[],x=>x):(P[c]||[])[+i]||0)); }); });
  const cs=[...root.querySelectorAll("tr[data-c]")].map(x=>x.dataset.c);
  root.querySelectorAll(".ftot").forEach(td=>{ const i=td.dataset.i; td.textContent=nf2(sum(cs,c=>i==="t"?sum(P[c]||[],x=>x):(P[c]||[])[+i]||0)); });
}
function repetirJan(cid){ const P=D().planejado[fP.ano]=D().planejado[fP.ano]||{}; const a=P[cid]=P[cid]||Array(12).fill(0); for(let i=1;i<12;i++) a[i]=a[0]; touch(); renderDPlan(); }
function copiarPlan(fonte){
  const ano=fP.ano, ant=String(+ano-1);
  const src= fonte==="plan" ? D().planejado[ant]||{} : gradeReal(ant);
  if(!Object.keys(src).length){ toast(`Não há ${fonte==="plan"?"planejamento":"lançamentos"} em ${ant}`); return; }
  if(Object.values(D().planejado[ano]||{}).some(a=>a.some(x=>x))&&!confirm(`Substituir o planejamento de ${ano}?`)) return;
  D().planejado[ano]=Object.fromEntries(Object.entries(src).map(([c,a])=>[c,a.map(x=>Math.round(x*100)/100)]));
  touch(); renderDPlan(); toast(`Planejamento de ${ano} preenchido com o ${fonte==="plan"?"planejado":"real"} de ${ant}`);
}
function limparPlan(){ if(!confirm(`Apagar todo o planejamento de ${fP.ano}?`)) return; delete D().planejado[fP.ano]; touch(); renderDPlan(); }

/* ================= FINANCEIRO: base de cálculo =================
   Regime de caixa: entrada = nota fiscal paga (data do pagamento); saída = despesa lançada (data do pagamento).
   Empréstimos a colaboradores não entram (só controle de saldo). */
const C_ENT="#5145B8", C_SAI="#C8691C";
function fluxoMensal(){
  const ent={}, sai={}, saiG={};
  recebimentos().forEach(r=>{ const m=r.data.slice(0,7); ent[m]=(ent[m]||0)+r.valor; });
  D().lancamentos.forEach(l=>{ const m=l.data.slice(0,7), g=grpDaCat(l.categoriaId)||"?"; sai[m]=(sai[m]||0)+l.valor; (saiG[m]=saiG[m]||{})[g]=(saiG[m][g]||0)+l.valor; });
  return {ent,sai,saiG};
}
const anosFin=()=>{ const F=fluxoMensal(); return [...new Set([anoNow(),...Object.keys(F.ent),...Object.keys(F.sai)].map(x=>x.slice(0,4)))].sort().reverse(); };
function mesesDe(sel){ if(sel==="12m"){ const r=[]; for(let i=11;i>=0;i--) r.push(addMes(ymNow(),-i)); return r; } return Array.from({length:12},(_,i)=>`${sel}-${String(i+1).padStart(2,"0")}`); }
function chavePer(ym,g){ const [y,m]=ym.split("-").map(Number); return g==="mes"?ym:g==="tri"?`${y}-T${Math.ceil(m/3)}`:g==="sem"?`${y}-S${m<=6?1:2}`:String(y); }
function nomePer(k){ if(/^\d{4}-\d{2}$/.test(k)) return mesCurto(k); const [y,p]=k.split("-"); if(!p) return y; return p[0]==="T"?`${p[1]}º tri ${y}`:`${p[1]}º sem ${y}`; }
function agrupar(meses,g,F){ const out=new Map(); meses.forEach(m=>{ const k=chavePer(m,g); const o=out.get(k)||{k,ent:0,sai:0,meses:[]}; o.ent+=F.ent[m]||0; o.sai+=F.sai[m]||0; o.meses.push(m); out.set(k,o); }); return [...out.values()]; }
function mediaFechada(F,campo,n){ const ms=Array.from({length:n},(_,i)=>addMes(ymNow(),-(i+1))); return sum(ms,m=>F[campo][m]||0)/n; }
function prazoMedioRecebimento(){
  const pg=state.notas.filter(n=>n.status==="paga"&&n.dataPagamento&&n.data);
  if(pg.length<3) return {dias:30,base:0};
  return {dias:Math.max(0,Math.round(sum(pg,n=>daysBetween(n.data,n.dataPagamento))/pg.length)),base:pg.length};
}
function chartEntSai(meses,F){
  const W=1000,H=210,pl=46,pr=10,pb=30,pt=14, bw=(W-pl-pr)/meses.length;
  const max=Math.max(1,...meses.map(m=>Math.max(F.ent[m]||0,F.sai[m]||0)));
  const k=v=>v>=1e6?(v/1e6).toLocaleString("pt-BR",{maximumFractionDigits:1})+" mi":v>=1e3?(v/1e3).toLocaleString("pt-BR",{maximumFractionDigits:0})+" mil":v?v.toFixed(0):"0";
  const ticks=[0,0.5,1].map(f=>max*f);
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Entradas e saídas por mês">`;
  ticks.forEach(t=>{ const y=H-pb-(t/max)*(H-pb-pt); s+=`<line x1="${pl}" x2="${W-pr}" y1="${y}" y2="${y}" stroke="#E6E4F1"/><text x="${pl-6}" y="${y+4}" text-anchor="end" font-size="11" fill="#625E80">${k(t)}</text>`; });
  meses.forEach((m,i)=>{
    const x0=pl+i*bw, w=Math.min(26,bw*0.32), gap=2, cx=x0+bw/2;
    [[F.ent[m]||0,C_ENT,"Entradas",cx-w-gap/2],[F.sai[m]||0,C_SAI,"Saídas",cx+gap/2]].forEach(([v,c,t,x])=>{
      const h=(v/max)*(H-pb-pt), y=H-pb-h;
      if(h>0) s+=`<path d="M${x},${H-pb}V${y+Math.min(4,h)}Q${x},${y} ${x+Math.min(4,h)},${y}H${x+w-Math.min(4,h)}Q${x+w},${y} ${x+w},${y+Math.min(4,h)}V${H-pb}Z" fill="${c}"/>`;
      s+=`<rect x="${x-3}" y="${pt}" width="${w+6}" height="${H-pb-pt}" fill="transparent"><title>${t} ${mesNome(m)}: ${brl(v)}</title></rect>`;
    });
    s+=`<text x="${cx}" y="${H-pb+16}" text-anchor="middle" font-size="12" fill="#625E80">${mesCurto(m)}</text>`;
  });
  s+=`<line x1="${pl}" x2="${W-pr}" y1="${H-pb}" y2="${H-pb}" stroke="#D5D2E6"/>`;
  return s+"</svg>";
}

/* ================= FINANCEIRO: relatórios ================= */
let fF={tipo:"dre",ano:anoNow(),g:"tri",meses:6,de:"",ate:"",ateMes:""};
const RELF={
  dre(){
    const F=fluxoMensal(), ano=fF.ano, meses=mesesDe(ano), pers=agrupar(meses,fF.g,F), ks=pers.map(p=>p.k);
    const porPer=fn=>pers.map(p=>sum(p.meses,fn));
    const entTipo={}; recebimentos().forEach(r=>{ if(!r.data.startsWith(ano)) return; const t="Conta "+r.conta, m=r.data.slice(0,7); (entTipo[t]=entTipo[t]||{})[m]=((entTipo[t]||{})[m]||0)+r.valor; });

    const catM={}; D().lancamentos.forEach(l=>{ if(!l.data.startsWith(ano)) return; const m=l.data.slice(0,7); (catM[l.categoriaId]=catM[l.categoriaId]||{})[m]=((catM[l.categoriaId]||{})[m]||0)+l.valor; });
    const cols=[{t:""},...ks.map(k=>({t:nomePer(k),r:1})),{t:"Total",r:1},{t:"% entradas",r:1}];
    const L=(nome,vals,cls="")=>{ const t=sum(vals,x=>x); return {nome,vals,t,cls}; };

      <div class="tablewrap"><table class="dre"><thead><tr>${cols.map(c=>`<th class="${c.r?"r":""}">${c.t}</th>`).join("")}</tr></thead><tbody>
      ${rows.map(r=>`<tr class="${r.cls}"><td>${esc(r.nome.trim())}</td>${r.vals.map(v=>`<td class="r num ${r.cls.includes("res")&&v<-EPS?"neg":""}">${fmt(v)}</td>`).join("")}<td class="r num ${r.cls.includes("res")&&r.t<-EPS?"neg":""}"><b>${fmt(r.t)}</b></td><td class="r num">${tE&&r.nome!=="ENTRADAS"?pctFmt(r.t/tE*100)+"%":""}</td></tr>`).join("")}
      <tr class="cat"><td>Margem</td>${res.map((v,i)=>`<td class="r num">${ent[i]?pctFmt(v/ent[i]*100)+"%":"—"}</td>`).join("")}<td class="r num">${tE?pctFmt((tE-sum(sai,x=>x))/tE*100)+"%":""}</td><td></td></tr>
      </tbody></table></div><p class="hint">Regime de caixa: entradas pela data de recebimento (notas fiscais pagas e entradas registradas sem nota); saídas pela data dos lançamentos de despesa.</p>`;
    const csv=[[`DEMONSTRATIVO DE RESULTADO ${ano}`],["",...ks.map(nomePer),"Total","% entradas"],...rows.map(r=>[r.nome.trim(),...r.vals.map(nf2),nf2(r.t),tE&&r.nome!=="ENTRADAS"?pctFmt(r.t/tE*100)+"%":""])];

  },
  fluxo(){
    const F=fluxoMensal(), hoje=todayISO(), m0=ymNow(), N=+fF.meses, meses=Array.from({length:N},(_,i)=>addMes(m0,i));
    const pz=prazoMedioRecebimento(), quando=d=>{ const x=new Date(d+"T12:00"); x.setDate(x.getDate()+pz.dias); const ym=x.toISOString().slice(0,7); return ym<m0?m0:ym; };

/* ================= FINANCEIRO: entradas =================

function addConta(){ const v=$("nct").value.trim(); if(!v||state.contas.includes(v)) return; state.contas.push(v); touch(); renderFEnt(); }

  state.entradas.forEach(e=>{ if(e.conta===old) e.conta=v; }); state.notas.forEach(n=>{ if(n.conta===old) n.conta=v; }); touch(); }
function entCsv(){ downloadCsv(`recebimentos_${todayISO()}.csv`,[["Data","Cliente / origem","Conta","Registro","Valor","Observações"],
  ...(window._entLista||[]).slice().reverse().map(r=>[fdate(r.data),r.origem,r.conta,r.fonte==="nf"?"NF "+r.ref.numero:r.fonte==="dup"?"Duplicada (não somada)":"Entrada sem nota no app",nf2(r.valor),r.ref.obs||""])]); }
function openEnt(id){
  const e=id?state.entradas.find(x=>x.id===id):{data:todayISO(),origem:"",valor:0,conta:"Polis",obs:"",nfId:""};
  const origens=[...new Set([...state.contratantes.map(k=>k.nome),...state.entradas.map(x=>x.origem)])].sort((a,b)=>a.localeCompare(b,"pt-BR"));
  const nfs=nfPagas().filter(n=>Math.abs(daysBetween(n.dataPagamento,e.data))<=60||n.id===e.nfId).sort((a,b)=>Math.abs(daysBetween(a.dataPagamento,e.data))-Math.abs(daysBetween(b.dataPagamento,e.data)));
  openModal(`<header><h3>${id?"Editar entrada":"Nova entrada"}</h3><button class="xbtn" onclick="closeModal()">×</button></header>
  <div class="body"><p class="hint" style="margin:0 0 10px">Use para recebimentos que não estão como nota fiscal paga no app (ex.: "Sem NF"). Recebimentos de notas fiscais são lançados em Recebimentos › Notas fiscais.</p>
    <div class="fgrid"><div class="field"><label>Data do recebimento</label><input id="en_d" type="date" value="${e.data}"></div>
      <div class="field"><label>Valor (R$)</label><input id="en_v" class="money" inputmode="decimal" value="${mv(e.valor)}" placeholder="0,00"></div>
      <div class="field"><label>Conta</label><select id="en_c">${sel(e.conta,[...new Set([...state.contas,e.conta])].map(c=>[c,c]))}</select></div></div>
    <div class="field"><label>Cliente / origem</label><input id="en_o" list="en_os" value="${esc(e.origem)}"><datalist id="en_os">${origens.map(o=>`<option value="${esc(o)}">`).join("")}</datalist></div>
    ${nfs.length?`<div class="field"><label>É a mesma entrada de uma nota fiscal já paga no app? <span class="sub">se for, não é somada de novo</span></label><select id="en_nf"><option value="">Não</option>${nfs.map(n=>`<option value="${n.id}" ${n.id===e.nfId?"selected":""}>NF ${esc(n.numero)} · ${fdate(n.dataPagamento)} · ${brl(n.valor)} · ${esc(cNome(cById(n.contratoId)))}</option>`).join("")}</select></div>`:""}
    <div class="field"><label>Observações</label><textarea id="en_ob">${esc(e.obs)}</textarea></div></div>
  <footer>${id?`<button class="btn danger" style="margin-right:auto" onclick="if(confirm('Excluir esta entrada?')){state.entradas=state.entradas.filter(x=>x.id!=='${id}');touch();closeModal();render()}">Excluir</button>`:""}
    <button class="btn" onclick="closeModal()">Cancelar</button><button class="btn primary" onclick="saveEnt(${id?`'${id}'`:"null"})">Salvar</button></footer>`);
}
function saveEnt(id){
  const d={data:$("en_d").value,valor:parseMoney($("en_v").value),conta:$("en_c").value,origem:$("en_o").value.trim(),obs:$("en_ob").value.trim(),nfId:$("en_nf")?$("en_nf").value:""};
  if(!d.data||!(d.valor>0)){ toast("Informe a data e o valor"); return; }
  if(!d.origem){ toast("Informe o cliente ou a origem"); $("en_o").focus(); return; }
  if(id) Object.assign(state.entradas.find(x=>x.id===id),d); else state.entradas.push({id:uid(),importado:false,...d});
  touch(); closeModal(); render(); toast(`Entrada ${id?"atualizada":"registrada"}: ${brl(d.valor)}`);
}
async function importarEntradas(o){
  const lote=o.origem||"planilha", velhas=state.entradas.filter(e=>e.lote===lote);
  if(velhas.length&&!confirm(`Este arquivo já foi importado antes (${velhas.length} entradas). Substituir essas entradas pelas do arquivo?`)) return;
  await fsBackupNow("antes-de-importar-entradas");
  state.entradas=state.entradas.filter(e=>e.lote!==lote);
  (o.contas||[]).forEach(c=>{ if(!state.contas.includes(c)) state.contas.push(c); });
  const usadas=new Set(state.entradas.map(e=>e.nfId).filter(Boolean)), novas=[];
  (o.entradas||[]).forEach(x=>{
    const e={id:uid(),data:x.data,origem:x.origem||"",valor:+x.valor||0,conta:x.conta||"Polis",obs:x.obs||"",nfId:"",importado:true,lote};
    const nf=nfPagas().find(n=>!usadas.has(n.id)&&Math.abs(n.valor-e.valor)<=0.05&&Math.abs(daysBetween(n.dataPagamento,e.data))<=7);
    if(nf){ e.nfId=nf.id; usadas.add(nf.id); }
    novas.push(e);
  });
  state.entradas.push(...novas); touch();
  const [p0,p1]=o.periodo||[novas.reduce((a,e)=>a<e.data?a:e.data,"9999"),novas.reduce((a,e)=>a>e.data?a:e.data,"")];
  const vinc=novas.filter(e=>e.nfId), soltas=nfPagas().filter(n=>n.dataPagamento>=p0&&n.dataPagamento<=p1&&!usadas.has(n.id));
  setMode("fin"); showTab("fent");
  openModal(`<header><h3>Entradas importadas</h3><button class="xbtn" onclick="closeModal()">×</button></header>
  <div class="body"><p><b>${novas.length}</b> entradas de ${fdate(p0)} a ${fdate(p1)}, somando <b>${brl(sum(novas,e=>e.valor))}</b>.</p>
    ${vinc.length?`<div class="alert ok">${vinc.length} delas já estavam no app como nota fiscal paga (mesmo valor e data próxima) e foram vinculadas a essas notas, sem somar de novo (${brl(sum(vinc,e=>e.valor))}).</div>`:""}
    ${soltas.length?`<div class="alert warn"><b>Confira:</b> há ${soltas.length} nota(s) marcada(s) como paga(s) no app nesse período sem entrada correspondente na planilha (${brl(sum(soltas,n=>n.valor))}). Se alguma delas for a mesma entrada com valor diferente (por exemplo, valor bruto da nota × valor líquido recebido), abra a entrada em Financeiro › Entradas e indique a nota, para não contar duas vezes.
      <ul style="margin:6px 0 0;padding-left:18px">${soltas.map(n=>`<li>NF ${esc(n.numero)} · pago em ${fdate(n.dataPagamento)} · ${brl(n.valor)} · ${esc(cNome(cById(n.contratoId)))}</li>`).join("")}</ul></div>`:`<div class="alert info">Nenhuma nota paga no app nesse período ficou sem correspondência — não há risco de contagem em dobro.</div>`}</div>
  <footer><button class="btn primary" onclick="closeModal()">Ok</button></footer>`);
}

/* ================= barra de ferramentas ================= */
function download(name,content,type){ const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([content],{type})); a.download=name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),500); }
const stamp=()=>todayISO();
$("btnPrint").addEventListener("click",()=>window.print());
$("btnExport").addEventListener("click",()=>{ download(`controle-pagamentos_backup_${stamp()}.json`,JSON.stringify(state,null,1),"application/json"); toast("Backup exportado"); });
function exportNotasCsv(){
  const rows=[["NF","Emissão","Contratante","Tipo","Obra","Nº proposta","Nº contrato","Descrição","Valor","Situação","Data pagamento"]];
  state.notas.slice().sort((a,b)=>a.data.localeCompare(b.data)).forEach(n=>{ const c=cById(n.contratoId)||{};
    rows.push([n.numero,fdate(n.data),cliNome(c),cliTipo(c),c.empreendimento,c.proposta,c.numContrato,n.descricao,nf2(n.valor),{emitida:"Aguardando",paga:"Paga",cancelada:"Cancelada"}[n.status],n.status==="paga"?fdate(n.dataPagamento):""]); });
  downloadCsv(`notas-fiscais_${stamp()}.csv`,rows);
}
$("btnImport").addEventListener("click",()=>$("fileInput").click());
$("fileInput").addEventListener("change",e=>{
  const f=e.target.files[0]; if(!f) return;
  const rd=new FileReader();
  rd.onload=async()=>{ try{ let txt=rd.result, o;
    if(/^\s*[{\[]/.test(txt)) o=JSON.parse(txt);
    else { const m=txt.match(/window\.__BAKED__=("(?:[^"\\]|\\.)*");/); if(!m) throw 0; o=JSON.parse(JSON.parse(m[1])); }
    if(o&&o.tipo==="polis-despesas"){ await importarDespesas(o); return; }
    if(o&&o.tipo==="polis-entradas"){ await importarEntradas(o); return; }
    if(!Array.isArray(o.contratos)) throw 0;
    if(!o.despesas) o.despesas=state.despesas;
    if(!o.entradas){ o.entradas=state.entradas; o.contas=state.contas; }   /* arquivos antigos não têm despesas: mantém as atuais */
    if(temDados(state) && !confirm("Importar substitui os dados de recebimentos atuais (eles vão para a pasta de backups). Continuar?")) return;
    await fsBackupNow("antes-de-importar");
    const fid=state.fileId; o=migrate(o); o.fileId=fid; state=o;
    selContrato=null; selK=null; touch(); render();
    toast(`Importado: ${state.contratantes.length} contratante(s), ${state.contratos.length} contrato(s), ${state.notas.length} nota(s)`);
  }catch(err){ toast("Arquivo não reconhecido — use um .html salvo pela planilha ou um backup .json"); } };
  rd.readAsText(f); e.target.value="";
});

/* ================= app instalável: service worker e atualização ================= */
if("serviceWorker" in navigator && location.protocol.startsWith("http")){
  navigator.serviceWorker.register("sw.js").then(reg=>{
    const mostrar=()=>$("updbar").classList.add("show");
    if(reg.waiting&&navigator.serviceWorker.controller) mostrar();
    reg.addEventListener("updatefound",()=>{ const nw=reg.installing; nw&&nw.addEventListener("statechange",()=>{ if(nw.state==="installed"&&navigator.serviceWorker.controller) mostrar(); }); });
    setInterval(()=>reg.update().catch(()=>{}),60*60*1000);
  }).catch(()=>{});
  let recarregou=false;
  navigator.serviceWorker.addEventListener("controllerchange",()=>{ if(recarregou) return; recarregou=true; location.reload(); });
}
async function aplicarAtualizacao(){
  if(FS.pending||FS.saving){ await fsSave(); }
  const reg=await navigator.serviceWorker.getRegistration(); if(reg&&reg.waiting) reg.waiting.postMessage("skip"); else location.reload();
}

/* ================= início ================= */
renderTabs(); document.querySelectorAll('.panel').forEach(p=>p.classList.toggle('active',p.id==='panel-'+curTab));
render();
fsInit();
</script>
</body>
</html>
