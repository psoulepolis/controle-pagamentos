<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Controle de Pagamentos · Polis</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1F1D3D">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  --ink:#1F1D3D; --ink-2:#2E2B57; --paper:#ECEBF4; --card:#FFFFFF;
  --line:#D5D2E6; --line-2:#E6E4F1; --water:#5145B8; --water-d:#3D3291;
  --water-2:#6A5FD6; --water-fill:#BDB6F0; --water-fill-2:#DEDAFA;
  --amber:#B9791A; --amber-bg:#FBF0DC; --red:#C0392B; --red-bg:#FBE7E4;
  --ok:#2E7D5B; --ok-bg:#E3F3EB; --calc:#F3F2FA; --muted:#625E80;
  --mono:ui-monospace,"SF Mono","JetBrains Mono","Cascadia Code",Consolas,monospace;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:var(--sans);color:var(--ink);background:var(--paper);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{margin:0;font-weight:650;letter-spacing:-.01em}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit}
.muted{color:var(--muted)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}

/* top bar */
.topbar{position:sticky;top:0;z-index:40;background:var(--ink);color:#EEEDF8;display:flex;align-items:center;gap:18px;padding:10px 20px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brand .brandlogo{height:24px;width:auto;display:block}
.brand .brandsep{width:1px;height:20px;background:rgba(255,255,255,.25)}
.brand .ttl{font-size:14px;font-weight:600;color:#fff;white-space:nowrap}
.tools{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tbtn{background:#2F2B5C;border:1px solid #423D78;color:#E2E0F4;font-size:12.5px;padding:6px 12px;border-radius:6px}
.tbtn:hover{background:#3A3570;border-color:#5A5496}
.tbtn.primary{background:var(--water);border-color:var(--water-d);color:#fff}
.tbtn.primary:hover{background:var(--water-2)}
.saveflag{font-family:inherit;font-size:12px;border:none;border-radius:14px;padding:5px 11px;background:transparent;color:#A7A0D8;cursor:default}
.saveflag:not(:disabled){cursor:pointer}
.saveflag.ok::before{content:"✓ ";color:#7FD3A8}
.saveflag.busy{color:#D8D4F5}
.saveflag.pending{background:#F2B233;color:#2A1C00;font-weight:700;animation:pulse 2.4s ease-in-out 2}
.saveflag.pending::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:#2A1C00;margin-right:7px;vertical-align:1px}
.saveflag.err{background:#E0574A;color:#fff;font-weight:700}
@keyframes pulse{50%{box-shadow:0 0 0 5px rgba(242,178,51,.3)}}
@media(prefers-reduced-motion:reduce){.saveflag.pending{animation:none}}

/* tabs */
.tabs{position:sticky;top:49px;z-index:35;background:var(--paper);display:flex;gap:2px;padding:0 20px;border-bottom:1px solid var(--line);overflow-x:auto}
.tab{border:none;background:transparent;padding:12px 16px 10px;font-size:13.5px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap}
.tab:hover{color:var(--ink)}
.tab.active{color:var(--ink);border-bottom-color:var(--water)}
.tab .cnt{font-family:var(--mono);font-size:11px;background:var(--line-2);color:var(--muted);border-radius:9px;padding:1px 7px;margin-left:6px}
.tab.active .cnt{background:var(--water-fill-2);color:var(--water-d)}

.wrap{padding:22px 20px 60px;max-width:1400px;margin:0 auto}
.panel{display:none}
.panel.active{display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-bottom:18px}
.card>header{padding:12px 16px;border-bottom:1px solid var(--line-2);display:flex;align-items:center;justify-content:space-between;gap:10px;background:linear-gradient(#fff,#FBFBFE);flex-wrap:wrap}
.card>header h3{font-size:14px}
.card .body{padding:16px}
.hint{font-size:12px;color:var(--muted);margin:2px 0 0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
@media(max-width:980px){.grid2{grid-template-columns:1fr}}

/* summary strip */
.strip{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:18px}
@media(max-width:980px){.strip{grid-template-columns:repeat(2,1fr)}}
.chip{display:flex;flex-direction:column;gap:3px;padding:12px 14px;border-radius:9px;background:#fff;border:1px solid var(--line)}
.chip .k{font-size:12px;color:var(--muted);font-weight:600}
.chip .v{font-family:var(--mono);font-size:19px;font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums}
.chip .u{font-size:11.5px;color:var(--muted)}
.chip.hl{background:var(--ink);border-color:var(--ink)}
.chip.hl .k,.chip.hl .u{color:#B3ADE0}
.chip.hl .v{color:#fff}
.chip.warn .v{color:var(--amber)}
.chip.good .v{color:var(--ok)}

/* progress */
.bar{height:8px;border-radius:5px;background:var(--line-2);overflow:hidden;display:flex;min-width:80px}
.bar i{display:block;height:100%}
.bar .pg{background:var(--water)}
.bar .em{background:var(--water-fill)}
.legend{display:flex;gap:14px;font-size:11.5px;color:var(--muted);align-items:center;flex-wrap:wrap}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px;background:var(--c)}

/* tables */
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
thead th{background:var(--ink);color:#E2E0F4;font-weight:600;padding:8px 10px;text-align:left;white-space:nowrap;font-size:11.5px}
thead th.r,td.r{text-align:right}
thead th.c,td.c{text-align:center}
tbody td{padding:8px 10px;border-bottom:1px solid var(--line-2);vertical-align:middle}
tbody tr:hover td{background:#F6F5FC}
tfoot td{padding:9px 10px;font-weight:650;background:var(--calc);border-top:1px solid var(--line)}
tr.click{cursor:pointer}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}
.empty .btn{margin-top:10px}

/* badges */
.badge{display:inline-block;font-size:11px;font-weight:650;padding:2px 8px;border-radius:10px;white-space:nowrap}
.b-ok{background:var(--ok-bg);color:var(--ok)}
.b-warn{background:var(--amber-bg);color:var(--amber)}
.b-red{background:var(--red-bg);color:var(--red)}
.b-info{background:var(--water-fill-2);color:var(--water-d)}
.b-mut{background:var(--line-2);color:var(--muted)}

/* buttons */
.btn{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:7px;padding:7px 12px;font-size:13px;font-weight:600}
.btn:hover{border-color:var(--water);color:var(--water-d)}
.btn.primary{background:var(--water);border-color:var(--water-d);color:#fff}
.btn.primary:hover{background:var(--water-2);color:#fff}
.btn.sm{padding:4px 9px;font-size:12px}
.btn.danger{color:var(--red)}
.btn.danger:hover{border-color:var(--red);background:var(--red-bg)}
.btn.link{border:none;background:none;padding:2px 4px;color:var(--water-d)}
.btn.link:hover{text-decoration:underline}
.row-actions{display:flex;gap:6px;justify-content:flex-end;flex-wrap:nowrap}

/* fields */
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px;min-width:0}
.field label{font-size:12px;font-weight:600;color:var(--ink-2)}
.field .sub{font-size:11px;color:var(--muted);font-weight:400}
.field input,.field select,.field textarea,.inp{border:1px solid var(--line);border-radius:7px;padding:8px 10px;font-size:13.5px;background:#fff;color:var(--ink);width:100%}
.field textarea{resize:vertical;min-height:58px}
.inp.money,.field input.money{font-family:var(--mono);text-align:right}
.field input:focus,.field select:focus,.field textarea:focus,.inp:focus{outline:none;border-color:var(--water);box-shadow:0 0 0 3px rgba(81,69,184,.14)}
.inp:disabled{background:var(--calc);color:#A09CBD}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:0 12px}
fieldset{border:1px solid var(--line);border-radius:9px;padding:12px 14px 4px;margin:4px 0 14px}
legend{font-size:12.5px;font-weight:650;padding:0 6px;color:var(--ink-2)}

/* disciplines picker */
.disc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:6px 14px;margin-bottom:8px}
.disc-row{display:grid;grid-template-columns:auto 1fr 74px 116px;gap:8px;align-items:center;padding:4px 6px;border-radius:7px}
.disc-row.on{background:var(--calc)}
.disc-row label{font-size:13px;cursor:pointer}
.disc-row input[type=checkbox]{width:16px;height:16px;accent-color:var(--water)}
.disc-row .inp{padding:5px 8px;font-size:12.5px}
.pctpair{display:grid;grid-template-columns:92px 1fr;gap:6px}
.pctin{position:relative}
.pctin input{padding-right:24px!important}
.pctin span{position:absolute;right:9px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:12.5px;pointer-events:none}
.custom-row{display:grid;grid-template-columns:1fr 130px auto;gap:8px;align-items:center;margin-bottom:6px}
.sumcheck{font-size:12px;padding:7px 10px;border-radius:7px;margin:4px 0 10px}

/* contracts layout */
.split{display:grid;grid-template-columns:340px 1fr;gap:18px;align-items:start}
@media(max-width:980px){.split{grid-template-columns:1fr}}
.clist{max-height:calc(100vh - 230px);overflow:auto}
.citem{padding:11px 14px;border-bottom:1px solid var(--line-2);cursor:pointer;display:flex;flex-direction:column;gap:6px}
.klink{color:inherit;text-decoration:none}.klink:hover{color:var(--water-d);text-decoration:underline}
.citem:hover{background:#F6F5FC}
.citem.sel{background:var(--calc);box-shadow:inset 3px 0 0 var(--water)}
.citem .t{font-weight:650;font-size:13.5px}
.citem .s{font-size:12px;color:var(--muted);display:flex;justify-content:space-between;gap:4px 8px;flex-wrap:wrap}
.card>header.clist-head{flex-direction:column;align-items:stretch}
.clist-head .seg{display:flex}
.clist-head .seg button{flex:1;white-space:nowrap}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.toolbar .inp{width:auto;min-width:160px;padding:6px 9px;font-size:13px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden}
.seg button{border:none;background:#fff;padding:6px 10px;font-size:12px;font-weight:600;color:var(--muted);border-right:1px solid var(--line)}
.seg button:last-child{border-right:none}
.seg button.on{background:var(--ink);color:#fff}
.kv{display:grid;grid-template-columns:170px 1fr;gap:6px 14px;font-size:13px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;white-space:pre-wrap}
.nextbox{border:1px dashed var(--water);background:#F4F3FC;border-radius:9px;padding:10px 14px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.nextbox.late{border-color:var(--red);background:var(--red-bg)}
.nextbox.none{border-color:var(--line);background:var(--calc)}

/* agenda */
.agenda-item{display:grid;grid-template-columns:92px 1fr auto;gap:12px;align-items:center;padding:10px 16px;border-bottom:1px solid var(--line-2)}
.agenda-item:last-child{border-bottom:none}
.agenda-item .d{font-family:var(--mono);font-size:12.5px}
.agenda-item .t{font-weight:600;font-size:13.5px}
.agenda-item .s{font-size:12px;color:var(--muted)}

/* chart */
.chart svg{display:block;width:100%;height:auto}

/* modal */
.modal-bg{position:fixed;inset:0;background:rgba(31,29,61,.45);z-index:80;display:none;align-items:flex-start;justify-content:center;padding:40px 16px;overflow:auto}
.modal-bg.show{display:flex}
.modal{background:#fff;border-radius:12px;width:min(860px,100%);box-shadow:0 20px 60px rgba(0,0,0,.25)}
.modal>header{padding:14px 18px;border-bottom:1px solid var(--line-2);display:flex;justify-content:space-between;align-items:center}
.modal>header h3{font-size:16px}
.modal .body{padding:16px 18px}
.modal>footer{padding:12px 18px;border-top:1px solid var(--line-2);display:flex;justify-content:flex-end;gap:8px;background:#FBFBFE;border-radius:0 0 12px 12px}
.xbtn{border:none;background:none;font-size:22px;line-height:1;color:var(--muted)}

.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:9px 16px;border-radius:8px;font-size:13px;opacity:0;transition:.2s;z-index:99;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

.alert{font-size:12.5px;padding:8px 11px;border-radius:7px;margin:0 0 12px}
.alert.warn{background:var(--amber-bg);color:#7A5210}
.alert.info{background:var(--calc);color:var(--ink-2)}
.alert.ok{background:var(--ok-bg);color:var(--ok)}

@media(max-width:700px){.topbar{position:static}.tabs{top:0}.agenda-item{grid-template-columns:1fr}.agenda-item .row-actions{justify-content:flex-start}.kv{grid-template-columns:1fr}}
.disc-custom{grid-template-columns:1fr 74px 116px auto}
.disc-row .pctin input,.disc-custom .pctin input{padding:5px 20px 5px 6px;font-size:12.5px}
.rv-cell .pctpair{grid-template-columns:76px 1fr}
.novok{background:var(--calc);border-radius:9px;padding:10px 12px 0;margin-bottom:12px}
.setup{border-color:var(--water);box-shadow:0 0 0 3px rgba(81,69,184,.08)}
.setup h3{font-size:16px;margin-bottom:6px}
.setup p{margin:0;max-width:760px}
.rep-tabs{display:flex;flex-wrap:wrap}
.rep-tabs button{flex:1;white-space:nowrap;padding:8px 10px;font-size:12.5px}
.rep .body{padding:22px 24px}
.rep-head{display:flex;align-items:center;gap:16px;border-bottom:2px solid var(--ink);padding-bottom:12px;margin-bottom:16px}
.rep-head img{height:30px;filter:brightness(0)}
.rep-head h2{font-size:18px}
.rep-gen{margin-left:auto;text-align:right}
.rep h4{font-size:13.5px;margin:20px 0 8px;color:var(--ink-2)}
.rep-sum{display:flex;flex-wrap:wrap;gap:10px;margin:4px 0 8px}
.rep-sum>div{flex:1;min-width:150px;background:var(--calc);border-radius:8px;padding:9px 12px;display:flex;flex-direction:column}
.rep-sum span{font-size:11.5px;color:var(--muted);font-weight:600}
.rep-sum b{font-size:16px}
.rep-sum small{font-size:12px;color:var(--muted)}
.rep-kv{margin-bottom:14px}
.updbar{position:fixed;left:50%;bottom:20px;transform:translateX(-50%) translateY(calc(100% + 40px));visibility:hidden;background:var(--ink);color:#fff;border-radius:10px;padding:10px 12px 10px 16px;display:flex;gap:12px;align-items:center;z-index:90;transition:.25s;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.updbar.show{transform:translateX(-50%) translateY(0);visibility:visible}
@media print{
  .topbar,.tabs,.btn,.seg,.toolbar .inp,.no-print{display:none!important}
  body{background:#fff}
  .card{break-inside:avoid;border-color:#bbb}
  .clist{max-height:none}
  .split{grid-template-columns:1fr}
  .split>.card:first-child{display:none}
  #banner,.updbar,.toast{display:none!important}
  body.printing-report .wrap>*:not(#panel-relatorios){display:none!important}
  body.printing-report #repOut{border:none}
  body.printing-report .rep .body{padding:0}
  .rep table{font-size:11px}
  thead th{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
</head>

<script>
/* ================= estado ================= */
const APP_VERSION="R04";
const LS_CACHE="polis.pagamentos.app.cache";
const DATA_FILE="controle-pagamentos.json";
const DISC_PADRAO=["Terraplenagem","Drenagem","Água","Esgoto","Estação elevatória de esgoto","Pavimentação","Sinalização","EIV","RIT","PGRCC","PGRS"];
const TIPOS_PADRAO=["Construtora / incorporadora","Loteadora","Poder público","Pessoa física","Outros"];
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const clone=o=>JSON.parse(JSON.stringify(o));
const norm=x=>String(x||"").trim().toLowerCase();
function blankState(){ return {version:2,updatedAt:0,disciplinas:DISC_PADRAO.slice(),tiposContratante:TIPOS_PADRAO.slice(),contratantes:[],contratos:[],notas:[]}; }
function migrate(s){
  s=s||blankState();
  if(!s.fileId) s.fileId=uid();
  s.version=2;
  if(!Array.isArray(s.disciplinas)) s.disciplinas=DISC_PADRAO.slice();
  if(!Array.isArray(s.tiposContratante)) s.tiposContratante=TIPOS_PADRAO.slice();
  s.contratantes=(s.contratantes||[]).map(k=>({id:k.id||uid(),nome:k.nome||"",tipo:k.tipo||"",documento:k.documento||"",contato:k.contato||"",obs:k.obs||""}));
  s.contratos=(s.contratos||[]).map(c=>{
    let kid=c.contratanteId;
    if(!kid || !s.contratantes.some(k=>k.id===kid)){
      /* versões anteriores guardavam o nome do cliente como texto: agrupa pelo nome */
      const nome=(c.cliente||"").trim()||"(sem contratante)";
      let k=s.contratantes.find(k=>norm(k.nome)===norm(nome));
      if(!k){ k={id:uid(),nome,tipo:"",documento:"",contato:"",obs:""}; s.contratantes.push(k); }
      kid=k.id;
    }
    return {id:c.id||uid(),contratanteId:kid,empreendimento:c.empreendimento||"",proposta:c.proposta||c.numero||"",numContrato:c.numContrato||"",
      data:c.data||"",valor:+c.valor||0,disciplinas:(c.disciplinas||[]).map(d=>({id:d.id||uid(),nome:d.nome||"",valor:+d.valor||0})),
      condicao:c.condicao||"",prox:c.prox||{data:"",descricao:"",valor:0},obs:c.obs||"",encerrado:!!c.encerrado};
  });
  s.notas=(s.notas||[]).map(n=>({id:n.id||uid(),contratoId:n.contratoId,numero:n.numero||"",data:n.data||"",valor:+n.valor||0,
    descricao:n.descricao||"",status:n.status||"emitida",dataPagamento:n.dataPagamento||"",rateio:n.rateio||{},obs:n.obs||""}));
  delete s.savedAt;
  return s;
}
function lsGet(k){ try{ const r=localStorage.getItem(k); return r?JSON.parse(r):null; }catch(e){ return null; } }
let state=migrate(lsGet(LS_CACHE));
const temDados=s=>!!((s.contratos||[]).length||(s.notas||[]).length);
function cacheLocal(){ try{ localStorage.setItem(LS_CACHE,JSON.stringify(state)); }catch(e){} }
function touch(){ state.updatedAt=Date.now(); cacheLocal(); scheduleSave(); updateFlag(); }

/* ================= pasta de dados (File System Access) =================
   A MESMA pasta de dados pode ser acessada por mais de um caminho
   (ex.: rede do escritório e RaiDrive). O app tenta os caminhos na ordem
   cadastrada e usa o primeiro que responder. Sem acesso a nenhum, as alterações
   ficam guardadas neste computador e são gravadas quando a pasta voltar.
   "base" = versão do arquivo da pasta que este computador viu por último;
   serve para detectar se o arquivo foi alterado em outro lugar. */
const LS_BASE=LS_CACHE+":base";
const getBase=()=>{ const v=+localStorage.getItem(LS_BASE); return isFinite(v)?v:0; };
const setBase=v=>{ try{ localStorage.setItem(LS_BASE,String(v||0)); }catch(e){} };
const idb={
  open(){ return new Promise((res,rej)=>{ const r=indexedDB.open("polis-pagamentos",1); r.onupgradeneeded=()=>r.result.createObjectStore("kv"); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }); },
  async get(k){ const db=await this.open(); return new Promise(res=>{ const q=db.transaction("kv").objectStore("kv").get(k); q.onsuccess=()=>res(q.result); q.onerror=()=>res(null); }); },
  async set(k,v){ const db=await this.open(); return new Promise(res=>{ const tx=db.transaction("kv","readwrite"); tx.objectStore("kv").put(v,k); tx.oncomplete=()=>res(true); tx.onerror=()=>res(false); }); }
};
const FS={locs:[],cur:-1,status:"init",lastSave:0,err:"",timer:null,backupDay:"",saving:false,again:false,pending:false,locStatus:{},busy:false};
const fsSupported=()=>"showDirectoryPicker" in window;
Object.defineProperty(FS,"dir",{get(){ return FS.cur>=0&&FS.locs[FS.cur]?FS.locs[FS.cur].h:null; }});
const locNome=()=>FS.cur>=0&&FS.locs[FS.cur]?FS.locs[FS.cur].nome:"";
async function saveLocs(){ await idb.set("locs",FS.locs.map(l=>({id:l.id,nome:l.nome,h:l.h}))); }

async function fsInit(){
  if(!fsSupported()){ FS.status="unsupported"; render(); return; }
  let locs=null; try{ locs=await idb.get("locs"); }catch(e){}
  if(!locs){ let h=null; try{ h=await idb.get("dir"); }catch(e){} locs=h?[{id:uid(),nome:"Pasta principal",h}]:[]; if(h) { FS.locs=locs; await saveLocs(); } }
  FS.locs=locs||[];
  if(!FS.locs.length){ FS.status="none"; render(); return; }
  await fsConnect(false);
  setInterval(()=>{ if(FS.status==="offline") fsConnect(false); },30000);
  window.addEventListener("focus",()=>{ if(FS.status==="offline") fsConnect(false); });
  window.addEventListener("online",()=>{ if(FS.status==="offline") fsConnect(false); });
}
/* lê o arquivo de dados; lança erro se a pasta não estiver acessível */
async function readDisk(h){
  try{ const fh=await h.getFileHandle(DATA_FILE); return JSON.parse(await (await fh.getFile()).text()); }
  catch(e){
    if(e&&e.name==="NotFoundError"){ for await (const k of h.keys()){ break; } return null; } /* pasta ok, arquivo ainda não existe */
    throw e;
  }
}
async function permissao(h,pedir){
  try{ let p=h.queryPermission?await h.queryPermission({mode:"readwrite"}):"granted";
    if(p!=="granted"&&pedir) p=await h.requestPermission({mode:"readwrite"});
    return p; }catch(e){ return "prompt"; }
}
/* tenta os caminhos em ordem; pedir=true só quando o usuário clicou (o navegador exige) */
async function fsConnect(pedir){
  if(FS.busy) return; FS.busy=true;
  try{
    let precisaPermissao=false;
    for(let i=0;i<FS.locs.length;i++){
      const l=FS.locs[i], p=await permissao(l.h,pedir);
      if(p!=="granted"){ FS.locStatus[l.id]="perm"; precisaPermissao=true; continue; }
      let disk;
      try{ disk=await readDisk(l.h); }catch(e){ FS.locStatus[l.id]="off"; continue; }
      FS.locStatus[l.id]="ok"; FS.cur=i; FS.status="ok";
      for(let j=i+1;j<FS.locs.length;j++) delete FS.locStatus[FS.locs[j].id];
      await sincronizar(disk);
      return;
    }
    FS.cur=-1;
    FS.status= precisaPermissao&&!FS.locs.some(l=>FS.locStatus[l.id]==="ok") && FS.locs.every(l=>FS.locStatus[l.id]==="perm") ? "ask" : (precisaPermissao&&!pedir?"ask":"offline");
  } finally { FS.busy=false; render(); }
}
const fsReconnect=()=>fsConnect(true);
const fmtDH=t=>t?new Date(t).toLocaleString("pt-BR",{dateStyle:"short",timeStyle:"short"}):"—";
/* decide entre os dados deste computador e os do arquivo da pasta */
async function sincronizar(disk){
  const base=getBase(), localMudou=(state.updatedAt||0)>base;
  if(!disk){ await fsSave(true); return; }
  if(!temDados(state)&&!localMudou){ state=migrate(disk); cacheLocal(); setBase(disk.updatedAt||0); return; }
  if(disk.fileId!==state.fileId){
    const nD=(disk.contratos||[]).length, nL=state.contratos.length;
    if(!temDados(state) || confirm(`A pasta tem um controle diferente do que está neste computador (${nD} contrato(s) na pasta, ${nL} aqui).\n\nOK = abrir os dados da pasta\nCancelar = gravar na pasta os dados deste computador (o arquivo atual da pasta vai para backups)`)){
      await backupTexto(JSON.stringify(state,null,1),"deste-computador-substituido");
      state=migrate(disk); cacheLocal(); setBase(disk.updatedAt||0);
    } else { await fsBackupNow("antes-de-substituir"); await fsSave(true); }
    return;
  }
  const diskMudou=(disk.updatedAt||0)>base;
  if(!base){ /* primeira vez nesta versão: vale o mais recente */
    if((disk.updatedAt||0)>=(state.updatedAt||0)){ state=migrate(disk); cacheLocal(); setBase(disk.updatedAt||0); } else await fsSave(true);
    return;
  }
  if(!diskMudou&&!localMudou) return;
  if(!diskMudou&&localMudou){ await fsSave(true); toast("Alterações feitas sem acesso à pasta foram gravadas"); return; }
  if(diskMudou&&!localMudou){ state=migrate(disk); cacheLocal(); setBase(disk.updatedAt||0); return; }
  /* conflito: os dois lados mudaram */
  await backupTexto(JSON.stringify(disk,null,1),"conflito-versao-da-pasta");
  await backupTexto(JSON.stringify(state,null,1),"conflito-versao-deste-computador");
  if(confirm(`Os dados foram alterados nos dois lugares:\n• na pasta, em ${fmtDH(disk.updatedAt)} (outro computador ou outra sessão)\n• neste computador, em ${fmtDH(state.updatedAt)}\n\nOK = manter a versão DESTE COMPUTADOR\nCancelar = abrir a versão DA PASTA\n\nAs duas versões foram guardadas na subpasta backups.`)){
    await fsSave(true);
  } else { state=migrate(disk); cacheLocal(); setBase(disk.updatedAt||0); }
}
async function fsChoose(){ return fsAddLoc(!FS.locs.length); }
async function fsAddLoc(primeiro){
  let h;
  try{ h=await window.showDirectoryPicker({id:"polis-pagamentos",mode:"readwrite",startIn:"documents"}); }
  catch(e){ if(e&&e.name!=="AbortError") toast("Não foi possível acessar a pasta"); return; }
  if(!primeiro){
    let disk=null; try{ disk=await readDisk(h); }catch(e){}
    if(!disk && !confirm(`A pasta “${h.name}” não tem o arquivo ${DATA_FILE}.\nUm caminho alternativo precisa apontar para a MESMA pasta de dados. Adicionar mesmo assim?`)) return;
    if(disk && disk.fileId!==state.fileId && !confirm(`A pasta “${h.name}” tem outro controle de pagamentos, não o mesmo desta pasta. Adicionar mesmo assim?`)) return;
  }
  const sug= primeiro?"Escritório (rede)":(FS.locs.length===1?"Fora do escritório (RaiDrive)":"Caminho "+(FS.locs.length+1));
  const nome=(prompt("Dê um nome para este caminho:",sug)||sug).trim();
  FS.locs.push({id:uid(),nome,h}); await saveLocs();
  await fsConnect(true);
  if(FS.status==="ok") toast(primeiro?`Pasta “${h.name}” conectada — salvamento automático ativado`:`Caminho “${nome}” adicionado`);
}
async function fsRemoveLoc(id){
  const l=FS.locs.find(x=>x.id===id); if(!l) return;
  if(!confirm(`Remover o caminho “${l.nome}”? O arquivo de dados não é apagado, o app só deixa de usar esse caminho.`)) return;
  FS.locs=FS.locs.filter(x=>x.id!==id); delete FS.locStatus[id]; await saveLocs();
  FS.cur=-1; if(FS.locs.length) await fsConnect(false); else { FS.status="none"; render(); }
}
async function fsMoveLoc(i,d){ const a=FS.locs; [a[i],a[i+d]]=[a[i+d],a[i]]; await saveLocs(); FS.cur=-1; await fsConnect(false); }
async function fsRenameLoc(id,v){ const l=FS.locs.find(x=>x.id===id); if(l&&v.trim()){ l.nome=v.trim(); await saveLocs(); } render(); }

function scheduleSave(){
  if(FS.status!=="ok") return;
  clearTimeout(FS.timer); FS.pending=true; FS.timer=setTimeout(()=>fsSave(),400);
}
async function backupsDir(){ return FS.dir.getDirectoryHandle("backups",{create:true}); }
async function writeText(dir,name,txt){ const fh=await dir.getFileHandle(name,{create:true}); const w=await fh.createWritable(); await w.write(txt); await w.close(); }
const tsNow=()=>new Date().toISOString().slice(0,19).replace(/[:T]/g,"-");
async function backupTexto(txt,rotulo){ if(!FS.dir) return; try{ await writeText(await backupsDir(),`controle-pagamentos_${tsNow()}_${rotulo}.json`,txt); }catch(e){} }
async function fsBackupNow(rotulo){
  if(!FS.dir) return;
  try{ const prev=await FS.dir.getFileHandle(DATA_FILE).then(h=>h.getFile()).then(f=>f.text()).catch(()=>null); if(prev) await backupTexto(prev,rotulo); }catch(e){}
}
async function pruneBackups(bdir){
  try{
    const nomes=[]; for await (const [n,h] of bdir.entries()) if(h.kind==="file"&&/^controle-pagamentos_\d{4}-\d{2}-\d{2}\.json$/.test(n)) nomes.push(n);
    nomes.sort(); for(const n of nomes.slice(0,Math.max(0,nomes.length-60))) await bdir.removeEntry(n);
  }catch(e){}
}
/* forcar=true: já sincronizado, grava sem verificar a pasta de novo */
async function fsSave(forcar){
  clearTimeout(FS.timer); FS.pending=false;
  if(FS.status!=="ok"||!FS.dir){ updateFlag(); return; }
  if(FS.saving){ FS.again=true; return; }
  FS.saving=true; updateFlag();
  let falhou=false;
  try{
    const prevTxt=await FS.dir.getFileHandle(DATA_FILE).then(h=>h.getFile()).then(f=>f.text()).catch(e=>{ if(e&&e.name==="NotFoundError") return null; throw e; });
    if(!forcar && prevTxt){
      const disk=JSON.parse(prevTxt);
      if((disk.updatedAt||0)>getBase() && disk.updatedAt!==state.updatedAt){ FS.saving=false; await sincronizar(disk); render(); return; }
    }
    const day=todayISO();
    if(FS.backupDay!==day){
      const bdir=await backupsDir(), nome=`controle-pagamentos_${day}.json`;
      let existe=true; try{ await bdir.getFileHandle(nome); }catch(e){ existe=false; }
      if(!existe){ if(prevTxt) await writeText(bdir,nome,prevTxt); await pruneBackups(bdir); }
      FS.backupDay=day;
    }
    await writeText(FS.dir,DATA_FILE,JSON.stringify(state,null,1));
    setBase(state.updatedAt||0); FS.lastSave=Date.now(); FS.err="";
  }catch(e){
    falhou=true; FS.err=e&&e.message||String(e);
    if(e&&e.name==="NotAllowedError") FS.status="ask";
    else { FS.status="offline"; if(FS.locs[FS.cur]) FS.locStatus[FS.locs[FS.cur].id]="off"; FS.cur=-1; }
  }
  FS.saving=false; updateFlag();
  if(falhou&&FS.status==="offline"){ renderBanner(); fsConnect(false); return; } /* tenta o outro caminho */
  if(FS.again){ FS.again=false; fsSave(); }
}
function flushSave(){ if(FS.pending) fsSave(); }
document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="hidden") flushSave(); });
window.addEventListener("pagehide",flushSave);
window.addEventListener("beforeunload",e=>{ if(FS.pending||FS.saving){ flushSave(); e.preventDefault(); e.returnValue=""; } });

function updateFlag(){
  const el=document.getElementById("saveflag"); if(!el) return;
  const hm=t=>new Date(t).toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"});
  let cls="", txt="", tip="", act=null;
  switch(FS.status){
    case "unsupported": cls="pending"; txt="Use Chrome ou Edge para salvar em pasta"; tip="Este navegador não permite gravar numa pasta. Os dados ficam só no navegador — exporte backups."; break;
    case "none": cls="pending"; txt="Escolher pasta de dados"; tip="Os dados ainda estão só no app. Clique para escolher a pasta onde o app vai salvar automaticamente."; act=fsChoose; break;
    case "ask": cls="pending"; txt="Clique para reconectar a pasta"; tip="O navegador pede uma confirmação para voltar a gravar na pasta de dados."; act=fsReconnect; break;
    case "offline": cls="pending"; txt=((state.updatedAt||0)>getBase()?"Sem acesso à pasta · alterações guardadas neste PC":"Sem acesso à pasta de dados"); tip="Nenhum caminho da pasta de dados está acessível agora. O app tenta de novo sozinho a cada 30 s; clique para tentar já."; act=fsReconnect; break;
    case "ok": if(FS.saving||FS.pending){ cls="busy"; txt="Salvando…"; } else { cls="ok"; txt=(FS.lastSave?`Salvo · ${hm(FS.lastSave)}`:"Salvamento automático ativo")+(FS.locs.length>1?` · ${locNome()}`:""); } tip=FS.dir?`Pasta de dados: ${FS.dir.name} (${locNome()})`:""; break;
    default: txt="";
  }
  el.className="saveflag "+cls; el.textContent=txt; el.title=tip; el.onclick=act; el.disabled=!act;
}

  const el=document.getElementById("banner"); if(!el) return;
  if(FS.status==="none") el.innerHTML=`<div class="card setup"><div class="body">
      <h3>Onde os dados vão ficar gravados?</h3>
      <p>Escolha a pasta de dados — no servidor do escritório, OneDrive ou Google Drive. O app grava ali, automaticamente, o arquivo <span class="mono">${DATA_FILE}</span> a cada alteração, e mantém uma cópia por dia em <span class="mono">backups</span>. Se a mesma pasta tiver outro caminho fora do escritório (ex.: RaiDrive), dá para adicioná-lo depois em Configurações.</p>
      <div class="row-actions" style="justify-content:flex-start;margin-top:12px"><button class="btn primary" onclick="fsChoose()">Escolher pasta de dados</button>
      ${temDados(state)?"":`<button class="btn" onclick="$('fileInput').click()">Importar planilha antiga (.html ou .json)</button>`}</div>
      <p class="hint" style="margin-top:10px">Se escolher uma pasta que já tem o arquivo de dados, o app abre o que estiver nela.</p></div></div>`;
  else if(FS.status==="ask") el.innerHTML=`<div class="card setup"><div class="body" style="display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap">
      <div><h3>Reconectar a pasta de dados</h3><p class="hint">Por segurança o navegador pede uma confirmação para voltar a gravar na pasta. ${temDados(state)?"Os dados abaixo são a última cópia guardada neste computador.":""}</p></div>
      <button class="btn primary" onclick="fsReconnect()">Reconectar e continuar</button></div></div>`;
  else if(FS.status==="offline") el.innerHTML=`<div class="alert warn" style="display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap">
      <span><b>Sem acesso à pasta de dados</b> (${FS.locs.map(l=>esc(l.nome)).join(", ")}). Pode continuar usando: as alterações ficam guardadas neste computador e são gravadas na pasta automaticamente quando ela voltar a responder.</span>
      <span class="row-actions"><button class="btn sm" onclick="fsReconnect()">Tentar agora</button><button class="btn sm" onclick="showTab('config')">Caminhos da pasta</button></span></div>`;
  else if(FS.status==="unsupported") el.innerHTML=`<div class="alert warn">Este navegador não permite gravar numa pasta do computador. Abra o app no Google Chrome ou no Microsoft Edge. Enquanto isso, os dados ficam só neste navegador — use "Exportar backup".</div>`;
  else el.innerHTML="";
}

/* ================= utilidades ================= */
const BRL=new Intl.NumberFormat("pt-BR",{style:"currency",currency:"BRL"});
const brl=v=>BRL.format(+v||0);
const nf2=v=>(+v||0).toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2});
function parseMoney(s){
  if(typeof s==="number") return s;
  s=String(s||"").replace(/R\$|\s/g,"");
  if(!s) return 0;
  if(s.includes(",")) s=s.replace(/\./g,"").replace(",",".");
  else if((s.match(/\./g)||[]).length>1 || /\.\d{3}$/.test(s)) s=s.replace(/\./g,"");
  const v=parseFloat(s); return isFinite(v)?Math.round(v*100)/100:0;
}
const esc=s=>String(s??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
const fdate=d=>{ if(!d) return "—"; const [y,m,dd]=d.split("-"); return `${dd}/${m}/${y}`; };
const todayISO=()=>{ const d=new Date(); return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10); };
const daysBetween=(a,b)=>Math.round((new Date(b+"T12:00")-new Date(a+"T12:00"))/86400000);
const sum=(arr,f)=>arr.reduce((a,x)=>a+(+f(x)||0),0);
const EPS=0.005;
const temProx=p=>!!(p&&(p.data||p.descricao||p.valor));
function toast(msg){ const t=document.getElementById("toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove("show"),2200); }
const cById=id=>state.contratos.find(c=>c.id===id);
const cNome=c=>c? [cliNome(c),c.empreendimento].filter(Boolean).join(" – ") || "(sem nome)" : "(contrato excluído)";

/* ================= cálculos ================= */
function notasDe(c){ return state.notas.filter(n=>n.contratoId===c.id && n.status!=="cancelada"); }
function resumo(c){
  const ns=notasDe(c), fat=sum(ns,n=>n.valor), rec=sum(ns.filter(n=>n.status==="paga"),n=>n.valor);
  const saldo=c.valor-fat;
  let st;
  if(c.encerrado) st={k:"enc",t:"Encerrado",cls:"b-mut"};
  else if(saldo<=EPS && fat-rec<=EPS) st={k:"quit",t:"Quitado",cls:"b-ok"};
  else if(saldo<=EPS) st={k:"fat",t:"100% faturado",cls:"b-info"};
  else st={k:"and",t:"Em andamento",cls:"b-warn"};
  return {fat,rec,aberto:fat-rec,saldo,pctFat:c.valor?fat/c.valor:0,pctRec:c.valor?rec/c.valor:0,st};
}
function resumoDisc(c){
  const ns=notasDe(c);
  const rows=c.disciplinas.map(d=>{ const f=sum(ns,n=>(n.rateio||{})[d.id]||0); return {d,contratado:d.valor,faturado:f,saldo:d.valor-f}; });
  const naoRateado=sum(ns,n=>n.valor-sum(Object.values(n.rateio||{}),v=>v));
  return {rows,naoRateado};
}
function ativo(c){ const r=resumo(c); return r.st.k==="and"; }
function progressBar(r){
  const pg=Math.min(100,r.pctRec*100), em=Math.max(0,Math.min(100,r.pctFat*100)-pg);
  return `<div class="bar" title="Recebido ${(r.pctRec*100).toFixed(0)}% · Faturado ${(r.pctFat*100).toFixed(0)}%"><i class="pg" style="width:${pg}%"></i><i class="em" style="width:${em}%"></i></div>`;
}
function statusNota(n){
  if(n.status==="paga") return `<span class="badge b-ok">Paga</span>`;
  if(n.status==="cancelada") return `<span class="badge b-mut">Cancelada</span>`;
  const d=n.data?daysBetween(n.data,todayISO()):0;
  return `<span class="badge ${d>30?"b-red":"b-warn"}">Aguardando${n.data?` · ${d} d`:""}</span>`;
}

/* ================= abas ================= */
let curTab="painel";
document.querySelectorAll(".tab").forEach(b=>b.addEventListener("click",()=>showTab(b.dataset.tab)));
function showTab(t){
  curTab=t;
  document.querySelectorAll(".tab").forEach(b=>b.classList.toggle("active",b.dataset.tab===t));
  document.querySelectorAll(".panel").forEach(p=>p.classList.toggle("active",p.id==="panel-"+t));
  render();
  window.scrollTo({top:0});
}
function render(){
  document.getElementById("cntC").textContent=state.contratos.length;
  document.getElementById("cntN").textContent=state.notas.length;
  document.getElementById("cntK").textContent=state.contratantes.length;
  renderBanner();
  ({painel:renderPainel,contratantes:renderContratantes,contratos:renderContratos,notas:renderNotas,relatorios:renderRelatorios,config:renderConfig})[curTab]();
  updateFlag();
}

/* ================= PAINEL ================= */
function renderPainel(){
  const el=document.getElementById("panel-painel");
  if(!state.contratos.length){
    el.innerHTML=`<div class="card"><div class="empty">
      <h3 style="margin-bottom:6px">Nenhum contrato cadastrado</h3>
      <div>Cadastre o primeiro contrato para começar a controlar as notas emitidas e os saldos.</div>
      <div style="display:flex;gap:8px;justify-content:center;margin-top:14px">
        <button class="btn primary" onclick="openContrato()">Novo contrato</button>
        <button class="btn" onclick="loadExample()">Carregar exemplo</button>
      </div></div></div>`;
    return;
  }
  const vivos=state.contratos.filter(c=>!c.encerrado);
  const R=vivos.map(c=>({c,r:resumo(c)}));
  const tot={valor:sum(vivos,c=>c.valor),fat:sum(R,x=>x.r.fat),rec:sum(R,x=>x.r.rec),aberto:sum(R,x=>x.r.aberto),saldo:sum(R,x=>Math.max(0,x.r.saldo))};
  const hoje=todayISO(), mes=hoje.slice(0,7);
  const fatMes=sum(state.notas.filter(n=>n.status!=="cancelada"&&n.data.startsWith(mes)),n=>n.valor);
  const recMes=sum(state.notas.filter(n=>n.status==="paga"&&(n.dataPagamento||"").startsWith(mes)),n=>n.valor);

  // agenda de cobranças
  const comProx=R.filter(x=>x.r.st.k==="and" && temProx(x.c.prox)).sort((a,b)=>(a.c.prox.data||"9999").localeCompare(b.c.prox.data||"9999"));
  const semProx=R.filter(x=>x.r.st.k==="and" && !temProx(x.c.prox));
  const agenda=comProx.map(({c,r})=>{
    const d=c.prox.data; const late=d&&d<hoje; const dd=d?daysBetween(hoje,d):null;
    const tag= !d?`<span class="badge b-mut">sem data</span>`: late?`<span class="badge b-red">atrasada ${-dd} d</span>`: dd<=7?`<span class="badge b-warn">${dd===0?"hoje":"em "+dd+" d"}</span>`:"";
    return `<div class="agenda-item"><div class="d">${fdate(d)}</div>
      <div><div class="t">${esc(cNome(c))} ${tag}</div><div class="s">${esc(c.prox.descricao||"")}${c.prox.valor?` · previsto ${brl(c.prox.valor)}${pctOf(c.prox.valor,c)}`:""} · saldo ${brl(r.saldo)}</div></div>
      <div class="row-actions"><button class="btn sm primary" onclick="openNota({contratoId:'${c.id}'})">Emitir nota</button></div></div>`;
  }).join("") + (semProx.length?`<div class="agenda-item" style="background:var(--calc)"><div class="d">—</div><div><div class="t">Com saldo e sem próxima cobrança definida</div>
      <div class="s">${semProx.map(({c,r})=>`<a href="#" onclick="goContrato('${c.id}');return false">${esc(cNome(c))}</a> (${brl(r.saldo)})`).join(" · ")}</div></div><div></div></div>`:"");

  // aguardando pagamento
  const aguard=state.notas.filter(n=>n.status==="emitida").sort((a,b)=>a.data.localeCompare(b.data));
  const aguardHtml=aguard.length?`<div class="tablewrap"><table><thead><tr><th>NF</th><th>Emissão</th><th>Contrato</th><th class="r">Valor</th><th>Situação</th><th></th></tr></thead><tbody>
    ${aguard.map(n=>`<tr><td class="num">${esc(n.numero)}</td><td class="num">${fdate(n.data)}</td><td>${esc(cNome(cById(n.contratoId)))}</td><td class="r num">${brl(n.valor)}</td><td>${statusNota(n)}</td>
      <td><div class="row-actions"><button class="btn sm" onclick="marcarPaga('${n.id}')">Marcar paga</button></div></td></tr>`).join("")}
    </tbody><tfoot><tr><td colspan="3">Total a receber</td><td class="r num">${brl(sum(aguard,n=>n.valor))}</td><td colspan="2"></td></tr></tfoot></table></div>`
    :`<div class="empty">Nenhuma nota aguardando pagamento.</div>`;

  // tabela de contratos
  const linhas=R.sort((a,b)=>b.r.saldo-a.r.saldo).map(({c,r})=>`<tr class="click" onclick="goContrato('${c.id}')">
    <td><b>${esc(cliNome(c)||"—")}</b><div class="hint">${esc(c.empreendimento)}</div></td>
    <td class="r num">${brl(c.valor)}</td><td class="r num">${brl(r.fat)}</td><td class="r num">${brl(r.rec)}</td>
    <td class="r num" style="${r.saldo>EPS?"font-weight:650":""}">${brl(r.saldo)}</td>
    <td style="min-width:120px">${progressBar(r)}</td><td>${`<span class="badge ${r.st.cls}">${r.st.t}</span>`}</td></tr>`).join("");

  el.innerHTML=`
  <div class="strip">
    <div class="chip"><span class="k">Contratado</span><span class="v">${brl(tot.valor)}</span><span class="u">${R.filter(x=>x.r.st.k==='and').length} em andamento · ${vivos.length} no total</span></div>
    <div class="chip"><span class="k">Faturado (NFs emitidas)</span><span class="v">${brl(tot.fat)}</span><span class="u">${tot.valor?(tot.fat/tot.valor*100).toFixed(0):0}% do contratado · ${brl(fatMes)} este mês</span></div>
    <div class="chip good"><span class="k">Recebido</span><span class="v">${brl(tot.rec)}</span><span class="u">${brl(recMes)} este mês</span></div>
    <div class="chip warn"><span class="k">A receber (emitido, não pago)</span><span class="v">${brl(tot.aberto)}</span><span class="u">${aguard.length} nota(s)</span></div>
    <div class="chip hl"><span class="k">Saldo a faturar</span><span class="v">${brl(tot.saldo)}</span><span class="u">ainda sem nota emitida</span></div>
  </div>
  <div class="grid2">
    <div class="card"><header><div><h3>Próximas cobranças</h3><p class="hint">Uma previsão por contrato, atualizada a cada nota emitida</p></div>
      <button class="btn sm primary no-print" onclick="openNota({})">Emitir nota</button></header>
      ${agenda||`<div class="empty">Nenhuma cobrança prevista.</div>`}</div>
    <div class="card"><header><h3>Notas aguardando pagamento</h3></header>${aguardHtml}</div>
  </div>
  <div class="card"><header><h3>Faturamento mensal · últimos 12 meses</h3><div class="legend"><span style="--c:var(--water)">Recebido</span><span style="--c:var(--water-fill)">Emitido, aguardando</span></div></header>
    <div class="body chart">${chartMensal()}</div></div>
  <div class="card"><header><h3>Contratos ativos</h3><div class="toolbar no-print"><button class="btn sm" onclick="openContrato()">Novo contrato</button></div></header>

function chartMensal(){
  const now=new Date(); const meses=[];
  for(let i=11;i>=0;i--){ const d=new Date(now.getFullYear(),now.getMonth()-i,1); meses.push(d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")); }
  const data=meses.map(m=>{ const ns=state.notas.filter(n=>n.status!=="cancelada"&&n.data.startsWith(m));
    return {m,pg:sum(ns.filter(n=>n.status==="paga"),n=>n.valor),em:sum(ns.filter(n=>n.status==="emitida"),n=>n.valor)}; });
  const max=Math.max(1,...data.map(d=>d.pg+d.em));
  const W=1000,H=170,pl=10,pb=34,pt=20,bw=(W-pl*2)/12;
  const nm=["jan","fev","mar","abr","mai","jun","jul","ago","set","out","nov","dez"];
  const k=v=>v>=1e6?(v/1e6).toLocaleString("pt-BR",{maximumFractionDigits:1})+" mi":v>=1e3?(v/1e3).toLocaleString("pt-BR",{maximumFractionDigits:0})+" mil":v?v.toFixed(0):"";
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Faturamento mensal">`;
  s+=`<line x1="${pl}" x2="${W-pl}" y1="${H-pb}" y2="${H-pb}" stroke="#D5D2E6"/>`;
  data.forEach((d,i)=>{
    const x=pl+i*bw+bw*0.2, w=bw*0.6, hp=(d.pg/max)*(H-pb-pt), he=(d.em/max)*(H-pb-pt);
    const y0=H-pb;
    s+=`<rect x="${x}" y="${y0-hp}" width="${w}" height="${hp}" fill="#5145B8" rx="2"><title>${brl(d.pg)} recebido</title></rect>`;
    s+=`<rect x="${x}" y="${y0-hp-he}" width="${w}" height="${he}" fill="#BDB6F0" rx="2"><title>${brl(d.em)} aguardando</title></rect>`;
    const tot=d.pg+d.em;
    if(tot) s+=`<text x="${x+w/2}" y="${y0-hp-he-5}" text-anchor="middle" font-size="12" fill="#2E2B57" font-family="ui-monospace,Consolas,monospace">${k(tot)}</text>`;
    const [yy,mm]=d.m.split("-");
    s+=`<text x="${x+w/2}" y="${H-pb+16}" text-anchor="middle" font-size="12" fill="#625E80">${nm[+mm-1]}</text>`;
    if(mm==="01"||i===0) s+=`<text x="${x+w/2}" y="${H-pb+30}" text-anchor="middle" font-size="10.5" fill="#625E80">${yy}</text>`;
  });
  return s+"</svg>";
}

    <div class="fgrid"><div class="field"><label>CNPJ / CPF <span class="sub">opcional</span></label><input id="k_doc" value="${esc(k.documento)}"></div>
      <div class="field"><label>Contato <span class="sub">opcional</span></label><input id="k_cont" value="${esc(k.contato)}" placeholder="nome, e-mail, telefone"></div></div>
    <div class="field"><label>Observações</label><textarea id="k_obs">${esc(k.obs)}</textarea></div>
  </div>
  <footer>${id?`<button class="btn danger" style="margin-right:auto" onclick="delContratante('${id}')">Excluir</button>`:""}
    <button class="btn" onclick="closeModal()">Cancelar</button><button class="btn primary" onclick="saveContratante(${id?`'${id}'`:"null"})">${id?"Salvar":"Cadastrar"}</button></footer>`);
}
function saveContratante(id){
  const nome=$("k_nome").value.trim(); if(!nome){ toast("Informe o nome do contratante"); return; }
  if(state.contratantes.some(k=>k.id!==id&&norm(k.nome)===norm(nome))){ toast("Já existe um contratante com esse nome"); return; }
  const dados={nome,tipo:$("k_tipo").value,documento:$("k_doc").value.trim(),contato:$("k_cont").value.trim(),obs:$("k_obs").value.trim()};
  if(id) Object.assign(kById(id),dados); else { const k={id:uid(),...dados}; state.contratantes.push(k); selK=k.id; }
  touch(); closeModal(); render(); toast(id?"Contratante atualizado":"Contratante cadastrado");
}
function delContratante(id){
  const n=state.contratos.filter(c=>c.contratanteId===id).length;
  if(n){ alert(`Este contratante tem ${n} contrato(s). Exclua ou transfira os contratos antes.`); return; }
  if(!confirm("Excluir este contratante?")) return;
  state.contratantes=state.contratantes.filter(k=>k.id!==id); selK=null; touch(); closeModal(); render();
}

/* ================= CONFIGURAÇÕES ================= */
function listEditor(key,titulo,hint,placeholder){
  const a=state[key];
  return `<div class="card"><header><div><h3>${titulo}</h3><p class="hint">${hint}</p></div></header><div class="body">
    ${a.map((d,i)=>`<div class="custom-row" style="grid-template-columns:1fr auto auto auto">
      <input class="inp" value="${esc(d)}" onchange="renameItem('${key}',${i},this.value)">
      <button class="btn sm" ${i===0?"disabled":""} onclick="movItem('${key}',${i},-1)" aria-label="Subir">↑</button>
      <button class="btn sm" ${i===a.length-1?"disabled":""} onclick="movItem('${key}',${i},1)" aria-label="Descer">↓</button>
      <button class="btn sm danger" onclick="state.${key}.splice(${i},1);touch();renderConfig()">Remover</button></div>`).join("")}
    <div class="custom-row" style="grid-template-columns:1fr auto;margin-top:12px">
      <input class="inp" id="new_${key}" placeholder="${placeholder}" onkeydown="if(event.key==='Enter')addItem('${key}')">
      <button class="btn primary" onclick="addItem('${key}')">Adicionar</button></div></div></div>`;
}
function renameItem(key,i,v){
  v=v.trim(); if(!v) return renderConfig();
  const old=state[key][i]; state[key][i]=v;
  if(key==="tiposContratante") state.contratantes.forEach(k=>{ if(k.tipo===old) k.tipo=v; });
  touch(); renderConfig();
}
function movItem(key,i,d){ const a=state[key]; [a[i],a[i+d]]=[a[i+d],a[i]]; touch(); renderConfig(); }
function addItem(key){ const v=$("new_"+key).value.trim(); if(!v) return; state[key].push(v); touch(); renderConfig(); }
function renderConfig(){
  const el=document.getElementById("panel-config");
  const stLoc=(l,i)=>i===FS.cur?`<span class="badge b-ok">em uso</span>`:FS.locStatus[l.id]==="off"?`<span class="badge b-mut">sem acesso agora</span>`:FS.locStatus[l.id]==="perm"?`<span class="badge b-warn">precisa reconectar</span>`:`<span class="badge b-mut">reserva</span>`;
  const pasta= FS.status==="unsupported" ? `<p>Este navegador não permite gravar numa pasta. Use Chrome ou Edge.</p>`
    : FS.locs.length ? `<p class="hint" style="margin:0 0 10px">O app grava em <span class="mono">${DATA_FILE}</span> usando o primeiro caminho da lista que estiver acessível. Cadastre aqui os diferentes caminhos da <b>mesma</b> pasta — por exemplo, a rede do escritório e o RaiDrive. Uma cópia por dia fica em <span class="mono">backups</span> (últimos 60 dias).</p>
        ${FS.locs.map((l,i)=>`<div class="custom-row" style="grid-template-columns:1fr auto auto auto auto;margin-bottom:8px">
          <div><input class="inp" value="${esc(l.nome)}" onchange="fsRenameLoc('${l.id}',this.value)"><div class="hint">pasta “${esc(l.h.name)}” · ${stLoc(l,i)}</div></div>
          <button class="btn sm" ${i===0?"disabled":""} onclick="fsMoveLoc(${i},-1)" aria-label="Subir">↑</button>
          <button class="btn sm" ${i===FS.locs.length-1?"disabled":""} onclick="fsMoveLoc(${i},1)" aria-label="Descer">↓</button>
          <span></span><button class="btn sm danger" onclick="fsRemoveLoc('${l.id}')">Remover</button></div>`).join("")}
        <div class="row-actions" style="justify-content:flex-start;margin-top:10px">${FS.status!=="ok"?`<button class="btn primary" onclick="fsReconnect()">Reconectar</button>`:""}<button class="btn" onclick="fsAddLoc(false)">+ Adicionar outro caminho para esta pasta</button></div>`
    : `<p>Nenhuma pasta escolhida — os dados estão só no app.</p><button class="btn primary" onclick="fsChoose()">Escolher pasta de dados</button>`;
  el.innerHTML=`<div class="grid2" style="align-items:start">
    <div>
      <div class="card"><header><h3>Caminhos da pasta de dados</h3></header><div class="body">${pasta}</div></div>
      ${listEditor("tiposContratante","Tipos de contratante","Usados para classificar e filtrar contratantes. Renomear aqui atualiza os contratantes que já usam o tipo.","Novo tipo (ex.: Associação de moradores)")}
      <div class="card"><header><div><h3>Começar do zero</h3><p class="hint">Apaga todos os contratantes, contratos e notas. Antes, o arquivo atual é copiado para a pasta de backups.</p></div>
        <button class="btn danger" onclick="apagarTudo()">Apagar todos os dados</button></header></div>
      <p class="hint">Versão do app: ${APP_VERSION}</p>

    <div>${listEditor("disciplinas","Disciplinas padrão","Aparecem como opções ao criar um contrato. Alterar aqui não muda contratos já cadastrados.","Nova disciplina (ex.: Iluminação pública)")}
      <button class="btn link" onclick="if(confirm('Restaurar a lista original de disciplinas?')){state.disciplinas=DISC_PADRAO.slice();touch();renderConfig()}">Restaurar lista original de disciplinas</button></div>
  </div>`;
}
async function apagarTudo(){
  const t=prompt('Isso apaga TODOS os dados do controle. Para confirmar, digite APAGAR');
  if((t||"").trim().toUpperCase()!=="APAGAR") return;
  await fsBackupNow("antes-de-apagar");
  const d=state.disciplinas, tp=state.tiposContratante, fid=state.fileId;
  state=migrate(blankState()); state.disciplinas=d; state.tiposContratante=tp; state.fileId=fid;
  selContrato=null; selK=null; touch(); render(); toast("Dados apagados — cópia anterior guardada em backups");
}

  if(!state.contratos.length){ toast("Cadastre um contrato antes de emitir notas"); openContrato(); return; }
  const c0=cById(n.contratoId);
  openModal(`<header><h3>${notaId?"Editar nota fiscal":"Emitir nota fiscal"}</h3><button class="xbtn" onclick="closeModal()">×</button></header>
  <div class="body">
    <div class="field"><label>Contrato</label><select id="n_c" onchange="nDraft.n.contratoId=this.value;nDraft.n.rateio={};nRefresh();valToPct('n_val','baseNota')"><option value="">Selecione…</option>${opts}</select></div>
    <div class="fgrid">
      <div class="field"><label>Nº da nota</label><input id="n_num" value="${esc(n.numero)}"></div>
      <div class="field"><label>Data de emissão</label><input id="n_data" type="date" value="${n.data}"></div>
      ${pctField("n_val",'Valor da nota <span class="sub">% do contrato ou R$</span>',n.valor,"baseNota","nInfo()")}
    </div>
    <div class="fgrid">
      <div class="field" style="grid-column:span 2"><label>Descrição / marco <span class="sub">opcional</span></label><input id="n_desc" value="${esc(n.descricao)}" placeholder="ex.: 2ª parcela – protocolo na Prefeitura"></div>
      <div class="field"><label>Situação</label><select id="n_st" onchange="document.getElementById('n_pgwrap').style.display=this.value==='paga'?'':'none'">
        <option value="emitida" ${n.status==="emitida"?"selected":""}>Aguardando pagamento</option>
        <option value="paga" ${n.status==="paga"?"selected":""}>Paga</option>
        <option value="cancelada" ${n.status==="cancelada"?"selected":""}>Cancelada</option></select></div>
      <div class="field" id="n_pgwrap" style="${n.status==="paga"?"":"display:none"}"><label>Data do pagamento</label><input id="n_dpg" type="date" value="${n.dataPagamento||todayISO()}"></div>
    </div>
    <div id="n_info"></div>
    <div id="n_rateio"></div>
    ${notaId?"":`<div id="n_prox"></div>`}
    <div class="field"><label>Observações</label><textarea id="n_obs">${esc(n.obs)}</textarea></div>
  </div>
  <footer>${notaId?`<button class="btn danger" style="margin-right:auto" onclick="delNota('${notaId}')">Excluir nota</button>`:""}
    <button class="btn" onclick="closeModal()">Cancelar</button><button class="btn primary" onclick="saveNota()">${notaId?"Salvar alterações":"Registrar nota"}</button></footer>`);
  nRefresh(); valToPct("n_val","baseNota");
}
function nSaldoAntes(c){ return c.valor-sum(notasDe(c).filter(x=>x.id!==nDraft.n.id),x=>x.valor); }
function nInfo(){
  const c=cById(nDraft.n.contratoId), el=document.getElementById("n_info"); if(!el) return;
  if(!c){ el.innerHTML=""; return; }
  const v=parseMoney(document.getElementById("n_val").value), antes=nSaldoAntes(c), depois=antes-v;
  el.innerHTML=`<div class="alert ${depois<-EPS?"warn":"info"}">Saldo a faturar do contrato: <b class="num">${brl(antes)}</b> → após esta nota: <b class="num">${brl(depois)}</b>${depois<-EPS?" — a nota ultrapassa o saldo. Se houve aditivo, atualize o valor do contrato.":""}</div>`;
  rSum();
}
function nRefresh(){
  const c=cById(nDraft.n.contratoId);
  const rEl=document.getElementById("n_rateio");
  if(!c||!c.disciplinas.length){ rEl.innerHTML=""; }
  else{
    const ns=notasDe(c).filter(x=>x.id!==nDraft.n.id);
    const temVal=c.disciplinas.some(d=>d.valor>0);
    rEl.innerHTML=`<fieldset><legend>Rateio por disciplina <span class="muted" style="font-weight:400">— opcional</span></legend>
      <div class="tablewrap"><table><thead><tr><th>Disciplina</th><th class="r">Contratado</th><th class="r">Saldo</th><th class="r" style="width:230px">Nesta nota (% da disciplina ou R$)</th></tr></thead><tbody>
      ${c.disciplinas.map(d=>{ const f=sum(ns,x=>(x.rateio||{})[d.id]||0); return `<tr><td>${esc(d.nome)}</td><td class="r num">${d.valor?brl(d.valor):"—"}</td><td class="r num">${d.valor?brl(d.valor-f):"—"}</td>
        <td class="rv-cell"><div class="pctpair"><div class="pctin"><input class="inp money rp" inputmode="decimal" placeholder="0" data-base="${d.valor}" ${d.valor?"":"disabled title='Sem valor contratado para esta disciplina'"} oninput="rPct(this)"><span>%</span></div>
          <input class="inp money rv" inputmode="decimal" data-id="${d.id}" data-saldo="${d.valor?d.valor-f:0}" value="${mv((nDraft.n.rateio||{})[d.id])}" oninput="rVal(this)"></div></td></tr>`; }).join("")}
      </tbody></table></div>
      <div style="display:flex;gap:8px;align-items:center;margin:10px 0 8px;flex-wrap:wrap">
        ${temVal?`<button class="btn sm" onclick="ratearProp()">Ratear proporcional ao saldo</button>`:""}
        <button class="btn sm" onclick="modal.querySelectorAll('.rv,.rp').forEach(i=>i.value='');rSum()">Limpar</button>
        <span id="rsum" class="hint" style="margin-left:auto"></span></div></fieldset>`;
  }
  modal.querySelectorAll(".rv").forEach(v=>rVal(v,true));
  const pEl=document.getElementById("n_prox");
  if(pEl){
    if(!c){ pEl.innerHTML=""; }
    else{
      const p=c.prox;
      pEl.innerHTML=`<fieldset><legend>Próxima cobrança deste contrato</legend>
        ${temProx(p)?`<p class="hint" style="margin:0 0 8px">Previsão atual: <b>${[p.data&&fdate(p.data),esc(p.descricao),p.valor&&brl(p.valor)+pctOf(p.valor,c)].filter(Boolean).join(" · ")}</b>. Se ela corresponde a esta nota, informe abaixo a seguinte — ou deixe em branco se não houver.</p>`
          :`<p class="hint" style="margin:0 0 8px">Informe quando será a próxima cobrança, se houver.</p>`}
        ${c.condicao?`<p class="hint" style="margin:0 0 8px">Condição do contrato: ${esc(c.condicao)}</p>`:""}
        <div class="fgrid">
          <div class="field"><label>Data prevista</label><input id="np_d" type="date"></div>
          <div class="field"><label>Marco / descrição</label><input id="np_desc"></div>
          ${pctField("np_val",'Valor previsto <span class="sub">% do contrato ou R$</span>',0,"baseNota")}</div>
        <label style="display:flex;gap:8px;align-items:center;font-size:12.5px;margin-bottom:8px"><input type="checkbox" id="np_keep" ${temProx(p)?"":"disabled"}> Manter a previsão atual (esta nota não era a cobrança prevista)</label>
      </fieldset>`;
    }
  }
  nInfo();
}
function rPct(el){
  const row=el.closest("tr"), b=+el.dataset.base||0, p=parseMoney(el.value);
  row.querySelector(".rv").value=(b&&p)?nf2(Math.round(b*p)/100):""; rSum();
}
function rVal(el,silencioso){
  const pi=el.closest("tr").querySelector(".rp"), b=+pi.dataset.base||0, v=parseMoney(el.value);
  if(document.activeElement!==pi) pi.value=(b&&v)?pctFmt(v/b*100):"";
  if(!silencioso) rSum();
}
function rSum(){
  const el=document.getElementById("rsum"); if(!el) return;
  const s=sum([...modal.querySelectorAll(".rv")],i=>parseMoney(i.value)), v=parseMoney(document.getElementById("n_val").value);
  if(!s){ el.textContent="Sem rateio: a nota conta só no total do contrato."; el.style.color=""; return; }
  const diff=v-s;
  el.innerHTML= Math.abs(diff)<=EPS?`Rateado ${brl(s)} — confere com a nota`
    :`Rateado ${brl(s)} de ${brl(v)} (${diff>0?"faltam "+brl(diff):"excede "+brl(-diff)}) <button class="btn sm" style="margin-left:6px" onclick="usarSomaRateio()">Usar ${brl(s)} como valor da nota</button>`;
  el.style.color= diff<-EPS?"var(--red)":Math.abs(diff)<=EPS?"var(--ok)":"var(--amber)";
}
function usarSomaRateio(){
  const s=sum([...modal.querySelectorAll(".rv")],i=>parseMoney(i.value));
  $("n_val").value=nf2(s); valToPct("n_val","baseNota"); nInfo();
}
function ratearProp(){
  const v=parseMoney(document.getElementById("n_val").value); if(!v){ toast("Informe primeiro o valor da nota"); return; }
  const ins=[...modal.querySelectorAll(".rv")], base=ins.map(i=>Math.max(0,+i.dataset.saldo)), tot=base.reduce((a,b)=>a+b,0);
  if(!tot){ toast("Nenhuma disciplina com saldo para ratear"); return; }
  let acc=0; ins.forEach((i,k)=>{ let x=k===ins.length-1?Math.round((v-acc)*100)/100:Math.round(v*base[k]/tot*100)/100; if(k<ins.length-1) acc+=x; i.value=x?nf2(x):""; rVal(i,true); });
  rSum();
}
function saveNota(){
  const n=nDraft.n;
  n.contratoId=document.getElementById("n_c").value;
  if(!n.contratoId){ toast("Selecione o contrato"); return; }
  n.numero=document.getElementById("n_num").value.trim();
  n.data=document.getElementById("n_data").value;
  n.valor=parseMoney(document.getElementById("n_val").value);
  if(!(n.valor>0)){ toast("Informe o valor da nota"); return; }
  if(!n.data){ toast("Informe a data de emissão"); return; }
  if(!n.numero && !confirm("A nota está sem número. Registrar mesmo assim?")) return;
  if(n.numero && state.notas.some(x=>x.id!==n.id&&x.numero===n.numero) && !confirm(`Já existe uma nota com o nº ${n.numero}. Registrar mesmo assim?`)) return;
  n.descricao=document.getElementById("n_desc").value.trim();
  n.status=document.getElementById("n_st").value;
  n.dataPagamento=n.status==="paga"?document.getElementById("n_dpg").value:"";
  n.obs=document.getElementById("n_obs").value.trim();
  const r={}; modal.querySelectorAll(".rv").forEach(i=>{ const x=parseMoney(i.value); if(x) r[i.dataset.id]=x; });
  if(sum(Object.values(r),x=>x)-n.valor>EPS){ toast("O rateio por disciplina passa do valor da nota"); return; }
  n.rateio=r;
  const c=cById(n.contratoId);
  if(nDraft.isNew && document.getElementById("np_d")){
    if(!document.getElementById("np_keep").checked)
      c.prox={data:document.getElementById("np_d").value,descricao:document.getElementById("np_desc").value.trim(),valor:parseMoney(document.getElementById("np_val").value)};
    state.notas.push(n);
  } else state.notas[state.notas.findIndex(x=>x.id===n.id)]=n;
  touch(); closeModal(); render();
  const rs=resumo(c);
  toast(nDraft.isNew?`NF ${n.numero} registrada · saldo a faturar ${brl(rs.saldo)}`:"Nota atualizada");
}
function delNota(id){
  if(!confirm("Excluir esta nota? Se ela foi cancelada na prefeitura, prefira marcar a situação como \"Cancelada\" para manter o histórico.")) return;
  state.notas=state.notas.filter(x=>x.id!==id); touch(); closeModal(); render(); toast("Nota excluída");
}

/* ================= barra de ferramentas ================= */
function download(name,content,type){ const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([content],{type})); a.download=name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),500); }
const stamp=()=>todayISO();
$("btnPrint").addEventListener("click",()=>window.print());
$("btnExport").addEventListener("click",()=>{ download(`controle-pagamentos_backup_${stamp()}.json`,JSON.stringify(state,null,1),"application/json"); toast("Backup exportado"); });
function exportNotasCsv(){
  const rows=[["NF","Emissão","Contratante","Tipo","Obra","Nº proposta","Nº contrato","Descrição","Valor","Situação","Data pagamento"]];
  state.notas.slice().sort((a,b)=>a.data.localeCompare(b.data)).forEach(n=>{ const c=cById(n.contratoId)||{};
    rows.push([n.numero,fdate(n.data),cliNome(c),cliTipo(c),c.empreendimento,c.proposta,c.numContrato,n.descricao,nf2(n.valor),{emitida:"Aguardando",paga:"Paga",cancelada:"Cancelada"}[n.status],n.status==="paga"?fdate(n.dataPagamento):""]); });
  downloadCsv(`notas-fiscais_${stamp()}.csv`,rows);
}
$("btnImport").addEventListener("click",()=>$("fileInput").click());
$("fileInput").addEventListener("change",e=>{
  const f=e.target.files[0]; if(!f) return;
  const rd=new FileReader();
  rd.onload=async()=>{ try{ let txt=rd.result, o;
    if(/^\s*[{\[]/.test(txt)) o=JSON.parse(txt);
    else { const m=txt.match(/window\.__BAKED__=("(?:[^"\\]|\\.)*");/); if(!m) throw 0; o=JSON.parse(JSON.parse(m[1])); }
    if(!Array.isArray(o.contratos)) throw 0;
    if(temDados(state) && !confirm("Importar substitui os dados atuais (eles vão para a pasta de backups). Continuar?")) return;
    await fsBackupNow("antes-de-importar");
    const fid=state.fileId; o=migrate(o); o.fileId=fid; state=o;
    selContrato=null; selK=null; touch(); render();
    toast(`Importado: ${state.contratantes.length} contratante(s), ${state.contratos.length} contrato(s), ${state.notas.length} nota(s)`);
  }catch(err){ toast("Arquivo não reconhecido — use um .html salvo pela planilha ou um backup .json"); } };
  rd.readAsText(f); e.target.value="";
});

/* ================= app instalável: service worker e atualização ================= */
if("serviceWorker" in navigator && location.protocol.startsWith("http")){
  navigator.serviceWorker.register("sw.js").then(reg=>{
    const mostrar=()=>$("updbar").classList.add("show");
    if(reg.waiting&&navigator.serviceWorker.controller) mostrar();
    reg.addEventListener("updatefound",()=>{ const nw=reg.installing; nw&&nw.addEventListener("statechange",()=>{ if(nw.state==="installed"&&navigator.serviceWorker.controller) mostrar(); }); });
    setInterval(()=>reg.update().catch(()=>{}),60*60*1000);
  }).catch(()=>{});
  let recarregou=false;
  navigator.serviceWorker.addEventListener("controllerchange",()=>{ if(recarregou) return; recarregou=true; location.reload(); });
}
async function aplicarAtualizacao(){
  if(FS.pending||FS.saving){ await fsSave(); }
  const reg=await navigator.serviceWorker.getRegistration(); if(reg&&reg.waiting) reg.waiting.postMessage("skip"); else location.reload();
}

/* ================= início ================= */
render();
fsInit();
</script>
